name: ci

on:
  push:
  pull_request:

# Lite não referencia RevitAPI: a matriz RevitYear documenta qual TFM cada
# ano do Revit carrega (2023 -> net48, 2026 -> net8.0-windows,
# 2027 -> net10.0-windows). O build valida o TFM correspondente.
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - revit-year: "2023"
            tfm: net48
          - revit-year: "2026"
            tfm: net8.0-windows
          - revit-year: "2027"
            tfm: net10.0-windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build (Revit ${{ matrix.revit-year }} -> ${{ matrix.tfm }})
        run: >
          dotnet build src/NodeAec.Licensing.Lite/NodeAec.Licensing.Lite.csproj
          -c Release -f ${{ matrix.tfm }} --nologo
